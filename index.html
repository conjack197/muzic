<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Component Example</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel to compile JSX in the browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Helper to join class names (replaces cn/clsx)
    function cn(...classes) {
      return classes.filter(Boolean).join(" ");
    }

    const Component = () => {
      const [count, setCount] = useState(0);

      return (
        <div className={cn("flex flex-col items-center gap-4 p-8 bg-white shadow-md border rounded-lg")}>
          <h1 className="text-2xl font-bold mb-2 text-slate-800">Component Example</h1>
          <h2 className="text-3xl font-semibold text-slate-700">{count}</h2>
          <div className="flex gap-3">
            <button 
              onClick={() => setCount((prev) => prev - 1)}
              className="w-10 h-10 flex items-center justify-center rounded-md border border-slate-300 bg-white hover:bg-slate-100 active:scale-95 font-bold text-lg text-slate-700 transition"
            >
              -
            </button>
            <button 
              onClick={() => setCount((prev) => prev + 1)}
              className="w-10 h-10 flex items-center justify-center rounded-md border border-slate-300 bg-white hover:bg-slate-100 active:scale-95 font-bold text-lg text-slate-700 transition"
            >
              +
            </button>
          </div>
        </div>
      );
    };

    function Demo() {
      return <Component />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Demo />);
  </script>
</body>
</html>
